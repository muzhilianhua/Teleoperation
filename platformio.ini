; Exoskeleton -> dexterous hand teleoperation firmware (M0: single joint).
;
; Target: ESP32-S3-WROOM-2-N32R16V (32 MB Octal flash + 16 MB Octal PSRAM).
; Board settings are copied from Dexhand_Encoded so both projects build identically.

[platformio]
default_envs = esp32-s3-n32r16

[env:esp32-s3-n32r16]
; Pinned to the locally installed platform (Arduino-ESP32 2.0.14) for reproducible builds
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = large_littlefs_32MB.csv
board_build.filesystem = littlefs

; Native USB-Serial/JTAG port ("USB" connector, VID:PID 303A:1001)
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The core defaults to gnu++11; the config table needs C++17 (inline constexpr).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DAS5048B_DEFAULT_SDA=8
    -DAS5048B_DEFAULT_SCL=9

test_ignore = test_*
; FW_GIT_REV for the host link HELLO frame
extra_scripts = pre:scripts/git_rev.py

; Host-side unit tests for the hardware-independent libraries:
;   ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = AS5048B, FeetechBus
test_build_src = no
